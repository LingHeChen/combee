<body class="text-on-surface font-body-lg antialiased h-screen w-screen overflow-hidden bg-primary-container flex items-center justify-center">
<!-- Modal Overlay -->
<div class="fixed inset-0 bg-primary-container/80 backdrop-blur-sm z-40 flex items-center justify-center p-gutter md:p-margin-desktop">
<!-- Modal Container (Level 1 Surface) -->
<div class="bg-surface-container-low border border-secondary-container w-full max-w-lg rounded-xl shadow-2xl overflow-hidden flex flex-col relative z-50 animate-in fade-in zoom-in-95 duration-200">
<!-- Hexagonal background subtle pattern -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cpath d=\'M30 0l25.98 15v30L30 60 4.02 45V15z\' stroke-width=\'1\' stroke=\'%23ffffff\' fill=\'none\'/%3E%3C/svg%3E'); background-size: 30px;"></div>
<!-- Header -->
<div class="px-6 py-5 border-b border-secondary-container/50 flex justify-between items-center relative z-10">
<div class="flex items-center gap-3">
<div class="w-6 h-6 flex items-center justify-center">
    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCeyU5b209B0MSdqSYZnU2dGMwjidNgT4z8mmBV3Ou9gjMGH4sAMzRAai8Sr_M8MO1VuNFVReZHT-M5fXwEAYcETgfPsZ3-rr5fIrLkjovUgOB-25X6JTx-6Xpc0QEjezti0Bdl8dqQiuPZuA9coMcYzMzpa_4YNU0KNJFhISuJX-1A8oQqq13KNGXnNIV4_UML_JPDqDKf-S5A_k3N9G0Upjlc5xV0V_chatd2C05lhiBwolBbxqyAeNgdz9wE1ieFpZI" alt="Combee Logo" class="w-full h-full object-contain">
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Create Cell</h2>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-md hover:bg-surface-container-highest">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="px-6 py-8 flex flex-col gap-8 relative z-10">
<!-- Helper Text -->
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed">
                    Deploy a new serverless Cell instantly. Resources scale automatically based on demand.
                </p>
<form class="flex flex-col gap-6">
<!-- Name Field -->
<div class="flex flex-col gap-2 glow-focus transition-shadow duration-300 rounded-lg">
<label class="font-mono-label text-mono-label text-primary flex justify-between items-center" for="cell-name">
                            NAME
                            <span class="text-on-surface-variant/50 text-[10px]">REQUIRED</span>
</label>
<div class="relative">
<input class="w-full bg-primary-container border border-secondary-container text-on-surface font-mono-code text-mono-code rounded-lg px-4 py-3 focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all placeholder:text-on-surface-variant/30" id="cell-name" placeholder="e.g., prod-api-gateway" type="text">
<div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center">
<span class="bg-secondary-container/50 text-on-surface-variant font-mono-label text-[10px] px-2 py-0.5 rounded border border-secondary-container">#ID-AUTO</span>
</div>
</div>
</div>
<!-- Region Field -->
<div class="flex flex-col gap-2 glow-focus transition-shadow duration-300 rounded-lg">
<label class="font-mono-label text-mono-label text-primary" for="cell-region">REGION</label>
<div class="relative">
<select class="w-full bg-primary-container border border-secondary-container text-on-surface font-mono-code text-mono-code rounded-lg px-4 py-3 appearance-none focus:outline-none focus:border-tertiary focus:ring-1 focus:ring-tertiary transition-all cursor-pointer" id="cell-region">
<option value="automatic">Automatic (Lowest Latency)</option>
<option value="us-east">US East (N. Virginia)</option>
<option value="us-west">US West (Oregon)</option>
<option value="eu-central">EU Central (Frankfurt)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</form>
</div>
<!-- Footer -->
<div class="px-6 py-5 bg-surface-container-highest/30 border-t border-secondary-container/50 flex justify-end gap-4 relative z-10">
<button class="px-5 py-2.5 rounded-lg border border-secondary-container text-on-surface font-mono-label text-mono-label hover:bg-surface-container-highest transition-colors">
                    Cancel
                </button>
<button class="px-5 py-2.5 rounded-lg bg-tertiary text-primary-container font-mono-label text-mono-label font-bold hover:bg-tertiary-fixed transition-colors flex items-center gap-2 group">
                    Create Cell
                    <span class="material-symbols-outlined text-[18px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div>
