# Combee 开发全栈:PostgreSQL(metadata)+ MinIO(对象存储/备份)+ Data Node(RPC)
# + API Server + Docs 文档站 + Landing。
# 与 deploy/docker-compose.cloud.yml 共用同一套环境变量(见 deploy/.env.example);
# 未设置时使用右侧默认值。
#
# 启动:`docker compose up -d --build`
# 端到端 benchmark:`cargo run --release -p combee-benchmark -- --e2e --url http://127.0.0.1:8080`
# 备份:`curl -X POST http://127.0.0.1:8080/v1/databases/<id>/backup`
# 恢复:`curl -X POST http://127.0.0.1:8080/v1/databases/<id>/restore`

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-combee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-combee}
      POSTGRES_DB: ${POSTGRES_DB:-combee}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-combee}"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - combee-pg-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-combee}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-combee123456}
    ports:
      # 宿主 9000 常被本机 php-fpm 占用,默认映射到 9010/9011;可用 MINIO_S3_PORT/MINIO_CONSOLE_PORT 覆盖
      - "${MINIO_S3_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - combee-minio-data:/data

  # 初始化 MinIO bucket(combee-backups),幂等。
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local ${COMBEE_S3_ENDPOINT:-http://minio:9000} ${MINIO_ROOT_USER:-combee} ${MINIO_ROOT_PASSWORD:-combee123456} 2>/dev/null); do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-combee-backups};
      echo 'bucket ready';
      exit 0;
      "

  data-node:
    build:
      context: .
      target: data-node
    command: ["/usr/local/bin/combee-data-node"]
    environment:
      COMBEE_DATA_NODE_ADDR: "0.0.0.0:${COMBEE_DATA_NODE_PORT:-9000}"
      # 节点代理:向 API Server 注册 + 心跳(不配则新 Cell 无节点可用)
      COMBEE_API_SERVER_URL: ${COMBEE_API_SERVER_URL:-http://api-server:8080}
      COMBEE_NODE_ADVERTISE_URL: ${COMBEE_NODE_ADVERTISE_URL:-http://data-node:9000}
      COMBEE_DATA_DIR: /data
      COMBEE_MAX_ACTIVE_DBS: "100"
      # 对象存储(备份/恢复)
      COMBEE_S3_ENDPOINT: ${COMBEE_S3_ENDPOINT:-http://minio:9000}
      COMBEE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-combee}
      COMBEE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-combee123456}
      COMBEE_S3_BUCKET: ${MINIO_BUCKET:-combee-backups}
      COMBEE_S3_REGION: ${MINIO_REGION:-us-east-1}
      # 控制面令牌(可选):与 api-server 共享;设置后 /internal/* 与 /rpc/* 需令牌
      COMBEE_CONTROL_PLANE_TOKEN: ${COMBEE_CONTROL_PLANE_TOKEN:-}
    volumes:
      - combee-dn-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  api-server:
    build:
      context: .
      target: api-server
    command: ["/usr/local/bin/combee-api-server"]
    environment:
      COMBEE_BIND_ADDR: "0.0.0.0:8080"
      COMBEE_METADATA: postgres
      # 由 POSTGRES_* 拼出,单一来源(与 deploy 版一致)
      COMBEE_DATABASE_URL: postgres://${POSTGRES_USER:-combee}:${POSTGRES_PASSWORD:-combee}@postgres:5432/${POSTGRES_DB:-combee}
      # 与 data-node 的监听端口共用 COMBEE_DATA_NODE_PORT
      COMBEE_DATA_NODE_URL: http://data-node:${COMBEE_DATA_NODE_PORT:-9000}
      COMBEE_DATA_DIR: /data
      COMBEE_CONTROL_PLANE_TOKEN: ${COMBEE_CONTROL_PLANE_TOKEN:-}
      # 认证:Key 模式(x-api-key 查表);测试用户/API key 创建见 README
      COMBEE_AUTH: ${COMBEE_AUTH:-off}
      COMBEE_ADMIN_TOKEN: ${COMBEE_ADMIN_TOKEN:-}
      # 预配置的 admin API key + 预置 key 列表(启动时注入 api_keys 表)
      COMBEE_BFF_SERVICE_KEY: ${COMBEE_BFF_SERVICE_KEY:-}
      COMBEE_API_KEYS: ${COMBEE_API_KEYS:-}
    ports:
      - "8080:8080"
    volumes:
      - combee-api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-node:
        condition: service_started

  # ---- Caddy 反向代理(开发统一入口:*.localhost 子域,不挂域名、无证书)----
  # Caddyfile 见 deploy/Caddyfile.dev;直接端口访问仍可用。
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy-dev-data:/data
    depends_on:
      - landing
      - docs
      - api-server
      - minio
      - web

  # ---- Cloud Console 云端后台(web/,主前端,Next.js BFF)----
  web:
    build:
      context: ./web
      args:
        # 浏览器端 API 地址(构建期内联);开发默认走 Caddy 反代
        NEXT_PUBLIC_COMBEE_API_URL: ${NEXT_PUBLIC_COMBEE_API_URL:-http://api.localhost}
    restart: unless-stopped
    environment:
      # 服务端 BFF 直连 api-server(容器内网,不经过 Caddy)
      COMBEE_API_URL: ${COMBEE_API_URL:-http://api-server:8080}
      COMBEE_API_KEY: ${COMBEE_API_KEY:-}
      COMBEE_BFF_API_KEY: ${COMBEE_BFF_API_KEY:-}
      # BFF 平台服务账号 key(新命名;与 api-server 的 COMBEE_BFF_SERVICE_KEY 一致)
      COMBEE_BFF_SERVICE_KEY: ${COMBEE_BFF_SERVICE_KEY:-}
      COMBEE_BFF_CELL: ${COMBEE_BFF_CELL:-}
      COMBEE_BFF_CELL_NAME: ${COMBEE_BFF_CELL_NAME:-}
      COMBEE_BFF_DEBUG: ${COMBEE_BFF_DEBUG:-}
      COMBEE_BFF_LOG_FILE: ${COMBEE_BFF_LOG_FILE:-}
      COMBEE_CONSOLE_SIGNUP: ${COMBEE_CONSOLE_SIGNUP:-}
    ports:
      - "${WEB_PORT:-3100}:3000"
    depends_on:
      - api-server

  # ---- Docs 文档站(site/,Fumadocs)----
  docs:
    build: ./site
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-3000}:3000"

  # ---- Landing(landing/,静态导出 + nginx)----
  landing:
    build: ./landing
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-3200}:80"

volumes:
  caddy-dev-data:
  combee-pg-data:
  combee-dn-data:
  combee-api-data:
  combee-minio-data:
