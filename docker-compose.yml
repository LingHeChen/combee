# Combee 四件套:PostgreSQL(metadata)+ MinIO(对象存储/备份)+ Data Node(RPC)+ API Server。
# 启动:`docker compose up -d --build`
# 端到端 benchmark:`cargo run --release -p combee-benchmark -- --e2e --url http://127.0.0.1:8080`
# 备份:`curl -X POST http://127.0.0.1:8080/v1/databases/<id>/backup`
# 恢复:`curl -X POST http://127.0.0.1:8080/v1/databases/<id>/restore`

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: combee
      POSTGRES_PASSWORD: combee
      POSTGRES_DB: combee
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U combee"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - combee-pg-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: combee
      MINIO_ROOT_PASSWORD: combee123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - combee-minio-data:/data

  # 初始化 MinIO bucket(combee-backups),幂等。
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 combee combee123456 2>/dev/null); do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/combee-backups;
      echo 'bucket ready';
      exit 0;
      "

  data-node:
    build: .
    command: ["/usr/local/bin/combee-data-node"]
    environment:
      COMBEE_DATA_NODE_ADDR: "0.0.0.0:9000"
      COMBEE_DATA_DIR: /data
      COMBEE_MAX_ACTIVE_DBS: "100"
      # 对象存储(备份/恢复)
      COMBEE_S3_ENDPOINT: http://minio:9000
      COMBEE_S3_ACCESS_KEY: combee
      COMBEE_S3_SECRET_KEY: combee123456
      COMBEE_S3_BUCKET: combee-backups
      COMBEE_S3_REGION: us-east-1
      # 控制面令牌(可选):与 api-server 共享;设置后 /internal/* 与 /rpc/* 需令牌
      COMBEE_CONTROL_PLANE_TOKEN: ${COMBEE_CONTROL_PLANE_TOKEN:-}
    volumes:
      - combee-dn-data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  api-server:
    build: .
    command: ["/usr/local/bin/combee-api-server"]
    environment:
      COMBEE_BIND_ADDR: "0.0.0.0:8080"
      COMBEE_METADATA: postgres
      COMBEE_DATABASE_URL: postgres://combee:combee@postgres:5432/combee
      COMBEE_DATA_NODE_URL: http://data-node:9000
      COMBEE_DATA_DIR: /data
      COMBEE_CONTROL_PLANE_TOKEN: ${COMBEE_CONTROL_PLANE_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - combee-api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      data-node:
        condition: service_started

volumes:
  combee-pg-data:
  combee-dn-data:
  combee-api-data:
  combee-minio-data:
